name: Test and deploy HeavenRepo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavenrepo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Test and deploy static site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run game unit and browser regression checks
        run: npm test
      - name: Deploy site to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HEAVENREPO }}
          action: upload
          app_location: site
          api_location: ""
          output_location: ""
          skip_app_build: true
