<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HeavenRepo · Agentic Playground</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #0d1117; color: #e6edf3; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  p.lede { color: #8b949e; margin: 0 0 40px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
  li a { display: block; padding: 20px 24px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; text-decoration: none; color: #e6edf3; transition: border-color .15s, transform .15s; }
  li a:hover { border-color: #58a6ff; transform: translateY(-2px); }
  .name { font-weight: 600; font-size: 1.1rem; }
  .desc { color: #8b949e; font-size: .9rem; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>HeavenRepo</h1>
  <p class="lede">An agentic playground — small web experiments, built and shipped by agents.</p>
  <ul>
    <li>
      <a href="typing/">
        <div class="name">Typing · 打字练习</div>
        <div class="desc">分阶段打字训练，中英文题库与本地排行榜。</div>
      </a>
    <li>
      <a href="schedule/">
        <div class="name">Weekly Schedule · 每周日程规划器</div>
        <div class="desc">支持可视化添加、编辑和删除每周日程，并完美适配 A4 纸张（横向/纵向）打印输出。</div>
      </a>
    </li>
  </ul>
</div>
</body>
