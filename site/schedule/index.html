<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每周日程规划与打印工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 头部控制栏 (打印时隐藏) -->
    <header class="no-print">
        <div class="header-container">
            <div class="logo-area">
                <span class="logo-icon">📅</span>
                <div>
                    <h1>每周日程规划器</h1>
                    <p class="subtitle">可视编辑 · 实时预览 · A4 纸张排版优化</p>
                </div>
            </div>
            <div class="actions">
                <div class="selector-group">
                    <label for="print-layout-select">打印布局:</label>
                    <select id="print-layout-select" class="control-select">
                        <option value="landscape">横向 A4 (推荐，适合7天并排)</option>
                        <option value="portrait">纵向 A4 (竖版排版)</option>
                    </select>
                </div>
                <button id="btn-clear" class="btn btn-secondary">清空日程</button>
                <button id="btn-print" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z" fill="currentColor"/></svg>
                    打印 / 导出 PDF
                </button>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="page-container">
        <!-- 每周日程表 (打印核心区域) -->
        <div id="schedule-sheet" class="schedule-sheet layout-landscape">
            <div class="sheet-header">
                <div class="sheet-title-area">
                    <h2 id="sheet-title" contenteditable="true" spellcheck="false">每周工作与生活日程安排</h2>
                    <p id="sheet-desc" contenteditable="true" spellcheck="false">点击可编辑标题和备注说明。双击日程块可进行编辑或删除，点击下方“+”可添加新项目。</p>
                </div>
                <div class="sheet-meta no-print">
                    <span class="badge">A4 自动适配</span>
                </div>
            </div>

            <!-- 7天日历网格 -->
            <div class="calendar-grid">
                <!-- 周一 -->
                <div class="day-column" data-day="1">
                    <div class="day-header">
                        <span class="day-name">星期一</span>
                        <span class="day-en">Monday</span>
                    </div>
                    <div class="events-list"></div>
                    <button class="add-event-btn no-print" title="添加日程">+</button>
                </div>

                <!-- 周二 -->
                <div class="day-column" data-day="2">
                    <div class="day-header">
                        <span class="day-name">星期二</span>
                        <span class="day-en">Tuesday</span>
                    </div>
                    <div class="events-list"></div>
                    <button class="add-event-btn no-print" title="添加日程">+</button>
                </div>

                <!-- 周三 -->
                <div class="day-column" data-day="3">
                    <div class="day-header">
                        <span class="day-name">星期三</span>
                        <span class="day-en">Wednesday</span>
                    </div>
                    <div class="events-list"></div>
                    <button class="add-event-btn no-print" title="添加日程">+</button>
                </div>

                <!-- 周四 -->
                <div class="day-column" data-day="4">
                    <div class="day-header">
                        <span class="day-name">星期四</span>
                        <span class="day-en">Thursday</span>
                    </div>
                    <div class="events-list"></div>
                    <button class="add-event-btn no-print" title="添加日程">+</button>
                </div>

                <!-- 周五 -->
                <div class="day-column" data-day="5">
                    <div class="day-header">
                        <span class="day-name">星期五</span>
                        <span class="day-en">Friday</span>
                    </div>
                    <div class="events-list"></div>
                    <button class="add-event-btn no-print" title="添加日程">+</button>
                </div>

                <!-- 周六 -->
                <div class="day-column" data-day="6">
                    <div class="day-header">
                        <span class="day-name">星期六</span>
                        <span class="day-en">Saturday</span>
                    </div>
                    <div class="events-list"></div>
                    <button class="add-event-btn no-print" title="添加日程">+</button>
                </div>

                <!-- 周日 -->
                <div class="day-column" data-day="7">
                    <div class="day-header">
                        <span class="day-name">星期日</span>
                        <span class="day-en">Sunday</span>
                    </div>
                    <div class="events-list"></div>
                    <button class="add-event-btn no-print" title="添加日程">+</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 编辑/添加日程的 Modal 弹窗 -->
    <div id="event-modal" class="modal-overlay no-print">
        <div class="modal-content">
            <h3 id="modal-heading">添加日程安排</h3>
            <form id="event-form">
                <input type="hidden" id="event-id">
                <input type="hidden" id="event-day">

                <div class="form-group">
                    <label for="event-title">日程内容 <span class="required">*</span></label>
                    <input type="text" id="event-title" placeholder="如：例会、健身、读书..." required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="event-start">开始时间</label>
                        <input type="time" id="event-start">
                    </div>
                    <div class="form-group">
                        <label for="event-end">结束时间</label>
                        <input type="time" id="event-end">
                    </div>
                </div>

                <div class="form-group">
                    <label>分类颜色</label>
                    <div class="color-picker">
                        <label class="color-option tag-blue"><input type="radio" name="event-color" value="blue" checked><span></span>工作</label>
                        <label class="color-option tag-green"><input type="radio" name="event-color" value="green"><span></span>学习</label>
                        <label class="color-option tag-purple"><input type="radio" name="event-color" value="purple"><span></span>会议</label>
                        <label class="color-option tag-orange"><input type="radio" name="event-color" value="orange"><span></span>生活</label>
                        <label class="color-option tag-rose"><input type="radio" name="event-color" value="rose"><span></span>娱乐</label>
                        <label class="color-option tag-gray"><input type="radio" name="event-color" value="gray"><span></span>其它</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="event-desc">备注说明 (可选)</label>
                    <textarea id="event-desc" rows="2" placeholder="地点、备注等细节..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-delete-event" class="btn btn-danger hidden">删除此日程</button>
                    <div class="right-actions">
                        <button type="button" id="btn-cancel" class="btn btn-secondary">取消</button>
                        <button type="submit" id="btn-save" class="btn btn-primary">保存</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 底部友情提示 -->
    <footer class="no-print">
        <p>数据自动保存在本地浏览器缓存中。使用快捷键 <kbd>Ctrl + P</kbd> 或点击右上角按钮直接进行打印适配。</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
